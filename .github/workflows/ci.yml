name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and start Django + Redis + Celery
        run: docker compose up --build -d redis django celery-worker

      - name: Wait for Django to be ready
        run: sleep 10

      - name: Run Ruff
        run: docker compose exec -T django ruff check .

      - name: Run mypy
        run: docker compose exec -T django mypy .

      - name: Run tests
        run: docker compose exec -T django python manage.py test

      - name: Tear down
        if: always()
        run: docker compose down